<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Login OOP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a4d8c; /* biru laut */
            padding: 40px;
        }

        .box {
            width: 320px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-top: 10px;
        }

        .input-group span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #f1c40f; /* kuning */
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 8px 8px 8px 35px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 15px;
            background-color: #0a4d8c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #083b6b;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Login User</h2>

    <div class="input-group">
        <span>👤</span>
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <span>🔒</span>
        <input type="password" id="password" placeholder="Password">
    </div>

    <button onclick="loginApp.login()">Login</button>
    <div class="footer">Dibuat di generator AI</div>
</div>

<div class="box" id="userBox" style="display:none;">
    <h2>Halaman User</h2>
    <p id="infoUser"></p>
    <button onclick="loginApp.logout()">Logout</button>
    <div class="footer">Dibuat di generator AI</div>
</div>

<script>

    constructor() {
        this.loadData();
    }

                { username: "admin", password: "admin123" },
                { username: "user", password: "user123" }
            ];
            localStorage.setItem("dataUser", JSON.stringify(dataUser));
        }
    }

    login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const users = JSON.parse(localStorage.getItem("dataUser"));
        const validUser = users.find(
            u => u.username === username && u.password === password
        );

        if (validUser) {
            this.showUser(validUser.username);
        } else {
            alert("salah login");
        }
    }

        document.getElementById("loginBox").style.display = "none";
