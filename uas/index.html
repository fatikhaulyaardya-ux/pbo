<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Login OOP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 40px;
        }
        .box {
            width: 320px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Login User</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginApp.login()">Login</button>
    <div class="footer">Dibuat di generator AI</div>
</div>

<div class="box" id="userBox" style="display:none;">
    <h2>Halaman User</h2>
    <p id="infoUser"></p>
    <button onclick="loginApp.logout()">Logout</button>
    <div class="footer">Dibuat di generator AI</div>
</div>

<script>
class LoginApp {
    constructor() {
        this.loadData();
    }

    loadData() {
        if (!localStorage.getItem("dataUser")) {
            const dataUser = [
                { username: "admin", password: "admin123" },
                { username: "user", password: "user123" }
            ];
            localStorage.setItem("dataUser", JSON.stringify(dataUser));
        }
    }

    login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const users = JSON.parse(localStorage.getItem("dataUser"));
        const validUser = users.find(
            u => u.username === username && u.password === password
        );

        if (validUser) {
            this.showUser(validUser.username);
        } else {
            alert("salah login");
        }
    }

    showUser(username) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("userBox").style.display = "block";
        document.getElementById("infoUser").innerText =
            "Selamat datang, " + username;
    }

    logout() {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("userBox").style.display = "none";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }
}

const loginApp = new LoginApp();
</script>

</body>
</html>
