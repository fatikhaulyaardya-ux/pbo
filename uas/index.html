<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login OOP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1c3d; /* biru dongker */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #142850;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            color: white;
        }

        h3 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            background: white;
            color: black;
        }

        input::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 15px;
            border: none;
            border-radius: 4px;
            background: white;
            color: #0b1c3d;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e0e0e0;
        }

        #userInfo {
            display: none;
            text-align: center;
        }
    </style>
</head>

    <button onclick="loginSystem.login()">Login</button>
</div>

<div class="box" id="userInfo">
    <h3>Selamat Datang</h3>
    <p id="infoUser"></p>
</div>
