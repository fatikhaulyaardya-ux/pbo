<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Login OOP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a4d8c; /* biru laut */
            padding: 40px;
        }

        .box {
            width: 320px;
            background: #fff;
            padding: 25px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* ===== INPUT GROUP ===== */
        .input-group {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 12px;
            padding: 6px 10px;
        }

        .input-group span {
            color: #f1c40f; /* kuning */
            font-size: 18px;
            margin-right: 10px;
            width: 22px;
            text-align: center;
        }

        .input-group input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        /* ===== BUTTON LOGIN ===== */
        button {
            width: 100%;
            padding: 9px;
            margin-top: 18px;
            background-color: #0a4d8c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }

        button:hover {
            background-color: #083b6b;
        }

        /* ===== BUTTON LOGOUT ===== */
        .logout-btn {
            background-color: #e74c3c;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .logout-btn span {
            margin-right: 6px;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="box" id="loginBox">
    <h2>Login User</h2>

    <div class="input-group">
        <span>👤</span>
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <span>🔒</span>
        <input type="password" id="password" placeholder="Password">
    </div>

    <button onclick="loginApp.login()">Login</button>
    <div class="footer">Dibuat di generator AI</div>
</div>

<!-- ===== USER PAGE ===== -->
<div class="box" id="userBox" style="display:none;">
    <h2>Halaman User</h2>
    <p id="infoUser"></p>

    <button class="logout-btn" onclick="loginApp.logout()">
        <span>🚪</span> Logout
    </button>

    <div class="footer">Dibuat di generator AI</div>
</div>

<script>
class LoginApp {
    constructor() {
        this.loadData();
    }

    loadData() {
        if (!localStorage.getItem("dataUser")) {
            const dataUser = [
                { username: "admin", password: "admin123" },
                { username: "user", password: "user123" }
            ];
            localStorage.setItem("dataUser", JSON.stringify(dataUser));
        }
    }

    login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const users = JSON.parse(localStorage.getItem("dataUser"));
        const validUser = users.find(
            u => u.username === username && u.password === password
        );

        if (validUser) {
            this.showUser(validUser.username);
        } else {
            alert("salah login");
        }
    }

    showUser(username) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("userBox").style.display = "block";
        document.getElementById("infoUser").innerText =
            "Selamat datang, " + username;
    }

    logout() {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("userBox").style.display = "none";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }
}

const loginApp = new LoginApp();
</script>

</body>
</html>
